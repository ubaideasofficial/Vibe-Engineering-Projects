services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "4000:4000"
    command: ["node", "apps/api/dist/index.js"]
    depends_on:
      - redis

  worker:
    build: .
    restart: unless-stopped
    env_file: .env.production
    command: ["node", "apps/worker/dist/index.js"]
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  redis-data: